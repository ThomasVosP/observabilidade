# Mapeamento Pergunta N → conceito canônico, por marca.
#
# Conceitos disponíveis:
#   nps_geral, nps_processo_compra, nps_test_drive,
#   nps_acessorios, nps_entrega, resposta_aberta
#
# Pergunta 1 = NPS Geral em TODAS as marcas (escala 0-10).
# As demais variam — perguntas não mapeadas vão apenas para pesquisas_respostas_raw.

default:
  1: nps_geral

# ── BYD ──────────────────────────────────────────────────────────────────────
BYD:
  1: nps_geral
  2: nps_processo_compra
  3: nps_test_drive
  4: nps_acessorios
  5: nps_entrega
  15: resposta_aberta

# ── VW (carros) ──────────────────────────────────────────────────────────────
"VW - VOLKSWAGEN":
  1: nps_geral
  2: nps_processo_compra
  3: nps_test_drive
  15: resposta_aberta

# ── VWC (caminhões) ──────────────────────────────────────────────────────────
